; PHP Configuration for File Uploads
; This file sets PHP upload limits for chat file attachments
; Note: These settings may not work if PHP-FPM is used. In that case, update php.ini directly.

upload_max_filesize = 5M
post_max_size = 10M
max_file_uploads = 10
max_execution_time = 300
max_input_time = 300
memory_limit = 128M

